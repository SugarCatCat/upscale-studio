[project]
name = "upscale-studio"
version = "0.1.0"
description = "独立的图片超分 / 视频补帧超分工具，不依赖 ComfyUI"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "torchvision>=0.18",
  "spandrel>=0.4",
  "safetensors>=0.4",
  "numpy>=1.26",
  "pillow>=10",
  "aiohttp>=3.9",
]

[project.scripts]
upscale-studio = "upscaler.cli:main"

[tool.setuptools.packages.find]
include = ["upscaler*"]
